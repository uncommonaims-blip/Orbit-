<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d20"><title>Orbit | Planetary Conquest</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070c1c;color:#f3f6ff;font:14px system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;left:14px;top:12px;right:14px;display:flex;justify-content:space-between;align-items:start;pointer-events:none;gap:8px}#hud>div{background:#101a32dc;border:1px solid #ffffff22;border-radius:12px;padding:9px 12px;backdrop-filter:blur(8px)}strong{font-size:17px}small{display:block;color:#a9bbd8;margin-top:3px}button{pointer-events:auto;background:#263b65;color:white;border:1px solid #6882b3;border-radius:9px;padding:8px 12px;font-weight:600;cursor:pointer}#help{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;background:#101a32c9;padding:10px 14px;border-radius:12px;color:#c9d7ef;pointer-events:none}#banner{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:25px;font-weight:800;text-shadow:0 2px 15px #000;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}#banner.visible{opacity:1}@media(max-width:450px){#hud>div{padding:7px 9px}strong{font-size:14px}#help{font-size:12px;bottom:8px}}
</style></head><body><canvas id="game" aria-label="Planetary conquest game"></canvas><div id="hud"><div><strong>ORBIT <span id="version" style="font-size:11px;font-weight:500;color:#a9bbd8">v0.14.1</span></strong><small id="stats">Blue: 1 · Red: 2</small></div><div><button id="music" aria-pressed="false" aria-label="Turn music on">♫ Off</button> <button id="restart">New system</button><small id="mode">Hold to aim</small></div></div><div id="banner" role="status"></div><div id="help">Hold multiple planets to fire · Tap asteroids for resources</div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stats=document.getElementById('stats'),banner=document.getElementById('banner');
const TAU=Math.PI*2,colors={player:'#5bd9ff',enemy:'#ff6e8b',neutral:'#aeb8d0'};
let W=0,H=0,dpr=1,scale=1,center={x:0,y:0},planets=[],ships=[],stars=[],drag=null,gameOver=false,last=0,acc=0,elapsed=0,seed=0,pointer=null; const HOLD_MS=380,SUN_RADIUS=29,SUN_MU=240000,PLANET_MU=36000,FIRE_INTERVAL=.11,MAX_POWER=165,POWER_PER_PIXEL=.72,MIN_PULL=12; let resources=[],resourceClock=0,resourceId=0,portals=[],storm=null,transition=0,visualClock=0,captureChime=0;let touches=new Map();let fireClock=0,systemNumber=1,systemsConquered=0,enemyClock=0,campaignWon=false;
const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);center={x:W/2,y:H/2+16};scale=Math.min(W/850,H/750,1.1);stars=Array.from({length:140},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.2,a:Math.random()*.5+.15}));}
function init(){seed=45219+systemNumber*7919;elapsed=0;resources=[];resourceClock=0;portals=[];storm=null;transition=2.8;visualClock=0;enemyClock=0;campaignWon=false;ships=[];drag=null;pointer=null;fireClock=0;touches.clear();gameOver=false;banner.classList.remove('visible');const specs=[
['Home',230,3.45,.10,24,'player',42,1.7,0],
['Cinder',135,0.25,.18,18,'neutral',18,1.05,0],
['Moss',210,2.4,-.11,21,'neutral',25,1.2,0],
['Azure',285,4.2,.08,22,'enemy',32,1.35,0],
['Ember',345,1.25,-.055,23,'enemy',34,1.4,0],
['Drift',390,3.0,.042,17,'neutral',15,1,0]];
planets=specs.map((s,i)=>({id:i,name:s[0],orbit:s[1],angle:s[2]+(systemNumber-1)*.37*(i%2?1:-1),speed:s[3]*(1+Math.min(.22,(systemNumber-1)*.035)),radius:s[4],owner:s[5],units:s[6]+(s[5]==='enemy'?Math.min(55,(systemNumber-1)*9):0),production:s[7],boostUntil:0,gravityUntil:0,phase:s[8],x:0,y:0}));position();setupEnvironment();updateHUD();updateSystemButton();}
function setupEnvironment(){
 const tier=(systemNumber-1)%4;
 if(systemNumber>=3&&tier===2){portals=[{x:center.x-145*scale,y:center.y-115*scale},{x:center.x+150*scale,y:center.y+110*scale}];}
 if(systemNumber>=4&&tier===3)storm={angle:0,radius:155*scale,width:65*scale};
 if(systemNumber>=5&&tier===0)portals=[{x:center.x-160*scale,y:center.y+95*scale},{x:center.x+155*scale,y:center.y-100*scale}];
}
function resourceType(){const n=Math.random();return systemNumber>=3&&n<.12?'gravity':systemNumber>=2&&n<.34?'boost':'fleet';}
function spawnResource(){const edge=Math.floor(Math.random()*4),margin=18,x=edge===0?-margin:edge===1?W+margin:Math.random()*W,y=edge===2?-margin:edge===3?H+margin:Math.random()*H;const theta=Math.atan2(center.y-y,center.x-x)+(Math.random()-.5)*1.6;resources.push({id:resourceId++,x,y,vx:Math.cos(theta)*(12+Math.random()*12),vy:Math.sin(theta)*(12+Math.random()*12),type:resourceType(),value:8+Math.floor(Math.random()*9),size:5+Math.random()*7,rotation:Math.random()*TAU,spin:(Math.random()-.5)*1.2,shape:Array.from({length:9},()=>.73+Math.random()*.5),target:null,life:0});}
function claimResource(x,y){const r=resources.find(o=>!o.target&&Math.hypot(o.x-x,o.y-y)<Math.max(26,o.size+15));if(!r)return false;const owned=planets.filter(p=>p.owner==='player');if(!owned.length)return false;r.target=owned.reduce((best,p)=>Math.hypot(p.x-r.x,p.y-r.y)<Math.hypot(best.x-r.x,best.y-r.y)?p:best,owned[0]);return true;}
function updateResources(dt){const owned=planets.filter(p=>p.owner==='player');resourceClock+=dt;const interval=owned.length<=1?5/3:11/3;if(resourceClock>=interval){resourceClock=0;if(resources.length<24)spawnResource();}for(let i=resources.length-1;i>=0;i--){const o=resources[i];o.life+=dt;if(o.target){if(o.target.owner!=='player')o.target=owned[0]||null;if(o.target){const dx=o.target.x-o.x,dy=o.target.y-o.y,d=Math.hypot(dx,dy)||1;o.vx+=(dx/d*260-o.vx)*Math.min(1,dt*3);o.vy+=(dy/d*260-o.vy)*Math.min(1,dt*3);if(d<radius(o.target)+8){if(o.type==='boost')o.target.boostUntil=elapsed+14;else if(o.type==='gravity')o.target.gravityUntil=elapsed+14;else o.target.units=Math.min(180,o.target.units+o.value);resources.splice(i,1);continue;}}}o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.life>45||o.x< -80||o.x>W+80||o.y< -80||o.y>H+80)resources.splice(i,1);}}
function radius(p){return 1.5*(11+Math.sqrt(Math.max(0,p.units))*1.8)*scale;}
function mass(p){return PLANET_MU*(.55+Math.max(0,p.units)/65)*(p.gravityUntil>elapsed?1.65:1);}
function position(){for(const p of planets){const a=p.angle+elapsed*p.speed;p.x=center.x+Math.cos(a)*p.orbit*scale;p.y=center.y+Math.sin(a)*p.orbit*scale*.78;}}
function shoot(from,dx,dy,power,owner='player'){if(from.units<1)return;const d=Math.hypot(dx,dy);if(d<1)return;from.units-=1;const nx=dx/d,ny=dy/d,r=radius(from)+6;const a=from.angle+elapsed*from.speed;const orbitalVX=-Math.sin(a)*from.orbit*scale*from.speed,orbitalVY=Math.cos(a)*from.orbit*scale*.78*from.speed;ships.push({x:from.x+nx*r,y:from.y+ny*r,vx:nx*power+orbitalVX,vy:ny*power+orbitalVY,owner,life:0,trail:[],source:from.id,exitedSource:false,portalCooldown:0});}
function enemyLaunch(from,to){if(from.units<12)return;const dx=to.x-from.x,dy=to.y-from.y;const burst=Math.min(6,1+Math.floor((systemNumber-1)/2));for(let i=0;i<burst&&from.units>=12;i++)shoot(from,dx,dy,Math.min(205,155+systemNumber*5),'enemy');}
function gravity(x,y){let ax=0,ay=0;const bodies=[{x:center.x,y:center.y,mu:SUN_MU*scale*scale,soft:SUN_RADIUS*scale*.7},...planets.map(p=>({x:p.x,y:p.y,mu:mass(p)*scale*scale,soft:radius(p)*.85}))];for(const p of bodies){const dx=p.x-x,dy=p.y-y,d2=Math.max(dx*dx+dy*dy,p.soft*p.soft),f=p.mu/(d2*Math.sqrt(d2));ax+=dx*f;ay+=dy*f;}return {ax,ay};}
function integrate(s,dt){const a=gravity(s.x,s.y);const nx=s.x+s.vx*dt+.5*a.ax*dt*dt,ny=s.y+s.vy*dt+.5*a.ay*dt*dt;const b=gravity(nx,ny);s.vx+=(a.ax+b.ax)*.5*dt;s.vy+=(a.ay+b.ay)*.5*dt;s.x=nx;s.y=ny;}
function trajectory(from,dx,dy,power){const d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d,r=radius(from)+5;const a=from.angle+elapsed*from.speed;const sim={x:from.x+nx*r,y:from.y+ny*r,vx:nx*power-Math.sin(a)*from.orbit*scale*from.speed,vy:ny*power+Math.cos(a)*from.orbit*scale*.78*from.speed};const pts=[];for(let i=0;i<240;i++){integrate(sim,.035);if(i%3===0)pts.push([sim.x,sim.y]);if(Math.hypot(sim.x-center.x,sim.y-center.y)<SUN_RADIUS*scale||planets.some(p=>p.id!==from.id&&Math.hypot(sim.x-p.x,sim.y-p.y)<radius(p))||Math.abs(sim.x-center.x)>W*2||Math.abs(sim.y-center.y)>H*2)break;}return pts;}
function capture(p,owner){if(p.owner===owner)p.units++;else{p.units--;if(p.units<=0){p.owner=owner;p.units=1;captureChime=elapsed;if(owner==='player')playCapture();}}}
function step(dt){if(gameOver)return;elapsed+=dt;visualClock+=dt;transition=Math.max(0,transition-dt);position();updateResources(dt);for(const touch of touches.values()){
 if(!touch.drag||touch.from.owner!=='player')continue;
 const dx=touch.from.x-touch.x,dy=touch.from.y-touch.y,pull=Math.hypot(dx,dy);
 if(pull>=MIN_PULL){
  touch.fireClock=Math.min(FIRE_INTERVAL*2,touch.fireClock+dt);
  while(touch.fireClock>=FIRE_INTERVAL&&touch.from.units>=1){
   shoot(touch.from,dx,dy,Math.min(MAX_POWER,pull*POWER_PER_PIXEL));touch.fireClock-=FIRE_INTERVAL;
  }
 }else touch.fireClock=0;
}
for(const p of planets){if(p.owner!=='neutral')p.units=Math.min(180,p.units+p.production*dt*(p.owner==='enemy'?.85:1)*(p.boostUntil>elapsed?2.1:1));}
enemyClock+=dt;const enemyInterval=Math.max(.8,3.5*Math.pow(.82,systemNumber-1));if(enemyClock>=enemyInterval){enemyClock-=enemyInterval;for(const p of planets.filter(p=>p.owner==='enemy'&&p.units>16)){const targets=planets.filter(t=>t!==p&&t.owner!=='enemy').sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));if(targets[0])enemyLaunch(p,targets[0]);}}
for(let i=ships.length-1;i>=0;i--){const s=ships[i];s.life+=dt;integrate(s,dt);s.trail.push([s.x,s.y]);if(s.trail.length>12)s.trail.shift();let hit=Math.hypot(s.x-center.x,s.y-center.y)<SUN_RADIUS*scale;
if(!hit)for(const p of planets){if(p.id===s.source&&!s.exitedSource){if(Math.hypot(s.x-p.x,s.y-p.y)>radius(p)+8)s.exitedSource=true;else continue;}if(Math.hypot(s.x-p.x,s.y-p.y)<radius(p)){capture(p,s.owner);hit=true;break;}}
if(!hit&&portals.length===2&&s.portalCooldown<=0){for(let j=0;j<2;j++){const a=portals[j],b=portals[1-j];if(Math.hypot(s.x-a.x,s.y-a.y)<17*scale){s.x=b.x+(s.x-a.x);s.y=b.y+(s.y-a.y);s.portalCooldown=.8;break;}}}s.portalCooldown=Math.max(0,(s.portalCooldown||0)-dt);if(storm){const rr=Math.hypot(s.x-center.x,s.y-center.y);if(Math.abs(rr-storm.radius)<storm.width){const theta=Math.atan2(s.y-center.y,s.x-center.x);s.vx+=-Math.sin(theta)*dt*13;s.vy+=Math.cos(theta)*dt*13;}}if(hit||s.life>45||Math.abs(s.x-center.x)>W*2||Math.abs(s.y-center.y)>H*2)ships.splice(i,1);}
const player=planets.some(p=>p.owner==='player'),enemy=planets.some(p=>p.owner==='enemy');if(!player||!enemy){gameOver=true;campaignWon=player;if(player){transition=3;playVictory();systemsConquered=Math.max(systemsConquered,systemNumber);banner.textContent='System '+systemNumber+' conquered! Advance to the next system';}else banner.textContent='System lost · Retry this system';banner.classList.add('visible');updateSystemButton();}updateHUD();}
function updateHUD(){stats.textContent='System '+systemNumber+' · Blue: '+planets.filter(p=>p.owner==='player').length+' · Red: '+planets.filter(p=>p.owner==='enemy').length+' · Fleets: '+ships.length;}
function updateSystemButton(){document.getElementById('restart').textContent=gameOver?(campaignWon?'Next system':'Retry system'):'New system';}
function nextSystem(){if(gameOver&&campaignWon)systemNumber++;else if(!gameOver)systemNumber++;init();}
// Visual evolution follows campaign progression, with restrained, beat-aware effects.
function drawCosmos(){
 const intensity=1-Math.exp(-Math.max(0,(systemNumber-1)*.27+(planets.filter(p=>p.owner==='player').length-1)*.025));
 const pulse=.5+.5*Math.sin(elapsed*(musicEnabled?2.4:1.2));
 const bg=ctx.createLinearGradient(0,0,W,H);
 bg.addColorStop(0,'#070c1c');bg.addColorStop(1,intensity>.35?'#210d43':'#0a1023');
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 if(intensity>.05){
  const clouds=[[-.15,.23,'165,42,255'],[.92,.7,'0,221,255'],[.48,.15,'255,32,177'],[.35,.85,'102,35,255']];
  clouds.forEach(([cx,cy,rgb],i)=>{
   const x=W*(cx+.06*Math.sin(elapsed*.04+i)),y=H*(cy+.07*Math.cos(elapsed*.03+i));
   const rad=Math.max(W,H)*(.35+i*.07),g=ctx.createRadialGradient(x,y,0,x,y,rad);
   g.addColorStop(0,'rgba('+rgb+','+(intensity*(.17+.075*pulse))+')');
   g.addColorStop(1,'rgba('+rgb+',0)');
   ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  });
 }
 for(const star of stars){
  const twinkle=intensity*(.28+.24*Math.sin(elapsed*(.8+star.r)+star.x*.05));
  ctx.globalAlpha=Math.min(.9,star.a+twinkle);
  ctx.fillStyle=intensity>.5&&star.x%3<1?'#e0a0ff':'#d7e7ff';
  ctx.beginPath();ctx.arc(star.x,star.y,star.r*(1+intensity*.4),0,TAU);ctx.fill();
 }
 ctx.globalAlpha=1;
 if(intensity>.22){
  ctx.save();ctx.translate(center.x,center.y);
  ctx.rotate(elapsed*.012);
  const rings=Math.floor(1+intensity*4);
  for(let i=0;i<rings;i++){
   const r=(105+i*65)*scale,alpha=(intensity-.18)*(.07+.025*pulse);
   ctx.strokeStyle='rgba('+(i%2?'65,240,255':'225,78,255')+','+alpha+')';
   ctx.lineWidth=1+intensity;
   ctx.beginPath();ctx.ellipse(0,0,r,r*.78,0,0,TAU);ctx.stroke();
  }
  ctx.restore();
 }
// Gentle traveling ultraviolet waves, never full-screen flashes.
if(systemNumber>=2){
 const count=Math.min(7,Math.floor(systemNumber/2));
 for(let j=0;j<count;j++){
  const period=5.5+j*.75,phase=((elapsed/period+j*.37)%1);
  const x=center.x+Math.sin(j*2.4)*W*.27,y=center.y+Math.cos(j*1.9)*H*.22;
  ctx.strokeStyle='rgba('+(j%2?'35,195,255':'185,75,255')+','+((1-phase)*intensity*.15)+')';
  ctx.lineWidth=2+intensity*3;
  ctx.beginPath();ctx.arc(x,y,(30+phase*Math.max(W,H)*.55)*scale,0,TAU);ctx.stroke();
 }
}
// A starfield distortion around gravity wells, bounded to a few nearby stars.
if(systemNumber>=3){
 for(const p of planets){
  const influence=radius(p)*2.6;
  ctx.strokeStyle='rgba(158,132,255,'+(intensity*.09)+')';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(p.x,p.y,influence,0,TAU);ctx.stroke();
 }
}
if(transition>0){
 const phase=1-transition/3;
 ctx.strokeStyle='rgba(155,110,255,'+(Math.min(.28,transition*.08))+')';
 ctx.lineWidth=3;ctx.beginPath();ctx.arc(center.x,center.y,Math.max(0,phase)*Math.max(W,H)*.9,0,TAU);ctx.stroke();
}

}
function draw(){ctx.clearRect(0,0,W,H);drawCosmos();
const sunR=SUN_RADIUS*scale;const glow=ctx.createRadialGradient(center.x,center.y,2,center.x,center.y,sunR*2.5);glow.addColorStop(0,'#fff5b1');glow.addColorStop(.25,'#ffc65e');glow.addColorStop(.55,'#f48b32');glow.addColorStop(1,'#f48b3200');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(center.x,center.y,sunR*2.5,0,TAU);ctx.fill();ctx.fillStyle='#ffdb78';ctx.beginPath();ctx.arc(center.x,center.y,sunR,0,TAU);ctx.fill();
for(const p of planets){if(!p.orbit)continue;ctx.beginPath();ctx.ellipse(center.x,center.y,p.orbit*scale,p.orbit*scale*.78,0,0,TAU);ctx.strokeStyle=systemNumber>=3?'#9e78e844':'#6e83ae24';ctx.lineWidth=1;ctx.stroke();}
if(storm){ctx.save();ctx.strokeStyle='rgba(190,76,255,.22)';ctx.lineWidth=storm.width;ctx.setLineDash([14,28]);ctx.beginPath();ctx.arc(center.x,center.y,storm.radius,0,TAU);ctx.stroke();ctx.setLineDash([]);ctx.restore();}
for(const portal of portals){const r=18*scale;ctx.strokeStyle='#c55bff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(portal.x,portal.y,r,0,TAU);ctx.stroke();ctx.strokeStyle='#5ef5ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(portal.x,portal.y,r*.62,0,TAU);ctx.stroke();}
for(const o of resources){
 const r=o.size*scale,angle=o.rotation+elapsed*o.spin;
 ctx.save();ctx.translate(o.x,o.y);ctx.rotate(angle);
 ctx.beginPath();o.shape.forEach((v,i)=>{const theta=i*TAU/o.shape.length,px=Math.cos(theta)*r*v,py=Math.sin(theta)*r*v;i?ctx.lineTo(px,py):ctx.moveTo(px,py);});ctx.closePath();
 ctx.fillStyle=o.target?'#829c91':o.type==='boost'?'#6489a0':o.type==='gravity'?'#8e76a4':'#777d89';ctx.fill();ctx.strokeStyle=o.target?'#9affce':'#b7bdc8';ctx.lineWidth=1.2;ctx.stroke();
 ctx.beginPath();ctx.arc(-r*.22,-r*.18,r*.22,0,TAU);ctx.fillStyle='#4c5360';ctx.fill();
 ctx.beginPath();ctx.arc(r*.3,r*.22,r*.13,0,TAU);ctx.fillStyle='#535b67';ctx.fill();
 ctx.restore();
 if(o.target){ctx.strokeStyle='#7fffc488';ctx.lineWidth=1.5;ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.target.x,o.target.y);ctx.stroke();ctx.setLineDash([]);}
}
for(const s of ships){ctx.strokeStyle=s.owner==='player'?'#5bd9ff77':'#ff6e8b77';ctx.lineWidth=1.5;ctx.beginPath();s.trail.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();ctx.fillStyle=colors[s.owner];ctx.beginPath();ctx.arc(s.x,s.y,2.2,0,TAU);ctx.fill();}
for(const p of planets){const r=radius(p);const col=colors[p.owner];const g=ctx.createRadialGradient(p.x-r*.4,p.y-r*.5,1,p.x,p.y,r*1.6);g.addColorStop(0,p.owner==='player'?'#c9f7ff':p.owner==='enemy'?'#ffc4cc':'#f0f3ff');g.addColorStop(.4,col);g.addColorStop(1,'#10182f');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=1.6;ctx.stroke();if(systemNumber>=2){const aura=Math.min(.32,(systemNumber-1)*.06);ctx.strokeStyle=p.owner==='player'?'rgba(89,228,255,'+aura+')':p.owner==='enemy'?'rgba(255,98,159,'+aura+')':'rgba(186,163,255,'+aura+')';ctx.lineWidth=2+Math.min(4,systemNumber*.5);ctx.beginPath();ctx.arc(p.x,p.y,r+5+2*Math.sin(elapsed*2+p.id),0,TAU);ctx.stroke();}ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold '+Math.max(11,13*scale)+'px system-ui';ctx.fillText(Math.floor(p.units),p.x,p.y+4);ctx.font='11px system-ui';ctx.fillStyle='#cbd5eb';ctx.fillText(p.name,p.x,p.y+r+15);if(p.boostUntil>elapsed||p.gravityUntil>elapsed){ctx.fillStyle='#e2bcff';ctx.font='10px system-ui';ctx.fillText(p.boostUntil>elapsed?'⚡ Production':'◈ Gravity',p.x,p.y+r+27);}}
for(const touch of touches.values()){
 if(!touch.drag)continue;
 const dx=touch.from.x-touch.x,dy=touch.from.y-touch.y,pull=Math.hypot(dx,dy),power=Math.min(MAX_POWER,pull*POWER_PER_PIXEL);
 if(pull<=5)continue;
 const pts=trajectory(touch.from,dx,dy,power);
 ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
 ctx.strokeStyle='#8ceaffb8';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([]);
 ctx.beginPath();ctx.moveTo(touch.from.x,touch.from.y);ctx.lineTo(touch.x,touch.y);ctx.strokeStyle='#5bd9ff';ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('Power '+Math.round(power/MAX_POWER*100)+'%',touch.x,touch.y-14);
}
}
function frame(t){
 if(!last)last=t;
 for(const touch of touches.values())if(!touch.drag&&performance.now()-touch.start>=HOLD_MS){touch.drag=true;touch.fireClock=FIRE_INTERVAL;}
 acc+=Math.min((t-last)/1000,.05);last=t;
 while(acc>=1/60){step(1/60);acc-=1/60;}
 draw();requestAnimationFrame(frame);
}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function pick(x,y){return planets.find(p=>Math.hypot(x-p.x,y-p.y)<Math.max(radius(p)+13,22));}
canvas.addEventListener('pointerdown',e=>{
 const q=point(e);if(claimResource(q.x,q.y))return;
 const p=pick(q.x,q.y);
 if(p?.owner==='player'&&!gameOver&&![...touches.values()].some(t=>t.from===p)){
  touches.set(e.pointerId,{from:p,x:q.x,y:q.y,start:performance.now(),drag:false,fireClock:0});
  canvas.setPointerCapture(e.pointerId);
 }
});
canvas.addEventListener('pointermove',e=>{
 const touch=touches.get(e.pointerId);if(!touch)return;
 const q=point(e);touch.x=q.x;touch.y=q.y;
 if(!touch.drag&&performance.now()-touch.start>=HOLD_MS){touch.drag=true;touch.fireClock=FIRE_INTERVAL;}
});
canvas.addEventListener('pointerup',e=>touches.delete(e.pointerId));
canvas.addEventListener('pointercancel',e=>touches.delete(e.pointerId));
// Original procedural 8-bit space-opera score; audio starts only after user interaction.
const musicButton=document.getElementById('music');
let audio=null,musicEnabled=false,musicTimer=null,nextBeat=0,beatIndex=0,musicRecovering=false;
// Beat-clock composition: fewer voices, reusable drum buffers, and bar-quantized transitions.
const BPM=128,BEAT=60/BPM/2,LOOKAHEAD=.18;
const roots=[45,48,41,43],chords=[[57,60,64],[60,64,67],[53,57,60],[55,59,62]];
const themes=[
 [76,null,79,null,83,null,79,null,74,null,76,null,79,null,76,null],
 [76,79,83,86,83,79,76,74,72,76,79,83,81,79,76,74],
 [88,86,83,79,81,83,86,88,91,88,86,83,81,79,83,86],
 [83,86,88,91,93,91,88,86,83,79,83,86,88,86,83,79]
];
const arp=[0,7,12,16,12,7,4,7,0,4,7,12,16,12,7,4];
let musicStage=0,master=null,drumBuffers={},musicPeak=0,lastChordRoot=45;
function conquestStage(){return Math.max(0,(systemNumber-1)*4+Math.max(0,planets.filter(p=>p.owner==='player').length-1));}
function playCapture(){if(!audio||!musicEnabled||audio.state!=='running')return;const t=audio.currentTime+.02;[0,7,12].forEach((n,i)=>note(lastChordRoot+24+n,t+i*.075,.26,'sine',.018));}
function playVictory(){if(!audio||!musicEnabled||audio.state!=='running')return;const t=audio.currentTime+.05;[0,4,7,12,16].forEach((n,i)=>note(lastChordRoot+12+n,t+i*.16,1.4,'triangle',.024));}
function hz(m){return 440*Math.pow(2,(m-69)/12);}
function note(m,t,d,type,vol,attack=.006){
 if(!audio||audio.state!=='running')return;
 const o=audio.createOscillator(),g=audio.createGain(),end=t+Math.max(.04,d);
 o.type=type;o.frequency.setValueAtTime(hz(m),t);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(attack,d*.4));
 g.gain.exponentialRampToValueAtTime(.0001,end);
 o.connect(g);g.connect(master);o.start(t);o.stop(end+.01);
 o.onended=()=>{o.disconnect();g.disconnect();};
}
// Rounded sub-bass with a brief filter sweep: weight without constant high-frequency buzz.
function bassPulse(m,t,d,vol){
 if(!audio||audio.state!=='running')return;
 const osc=audio.createOscillator(),sub=audio.createOscillator(),filter=audio.createBiquadFilter(),g=audio.createGain();
 const end=t+d;
 osc.type='sawtooth';sub.type='sine';osc.frequency.setValueAtTime(hz(m),t);sub.frequency.setValueAtTime(hz(m-12),t);
 filter.type='lowpass';filter.Q.value=.75;filter.frequency.setValueAtTime(450,t);filter.frequency.exponentialRampToValueAtTime(110,t+Math.min(.23,d*.65));
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.014);g.gain.exponentialRampToValueAtTime(.0001,end);
 const blend=audio.createGain();blend.gain.value=.65;
 osc.connect(filter);filter.connect(g);sub.connect(blend);blend.connect(g);g.connect(master);
 osc.start(t);sub.start(t);osc.stop(end+.01);sub.stop(end+.01);
 osc.onended=()=>{osc.disconnect();sub.disconnect();filter.disconnect();blend.disconnect();g.disconnect();};
}
// A softly moving harmonic bed, introduced as the campaign becomes cinematic.
// Bagpipe-like harmonic drone: audible upper partials, sustained notes, slow swells.
function drone(m,t,d,vol){
 if(!audio||audio.state!=='running')return;
 const filter=audio.createBiquadFilter(),g=audio.createGain(),voices=[];
 filter.type='lowpass';filter.frequency.value=1500;filter.Q.value=.45;
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.8);
 g.gain.setValueAtTime(vol,t+Math.max(.85,d-1));g.gain.exponentialRampToValueAtTime(.0001,t+d);
 filter.connect(g);g.connect(master);
 for(const [interval,detune,type,level] of [[0,-5,'sawtooth',.38],[0,5,'sawtooth',.38],[12,0,'triangle',.24],[7,2,'triangle',.18]]){
  const o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.value=hz(m+interval);o.detune.value=detune;v.gain.value=level;o.connect(v);v.connect(filter);o.start(t);o.stop(t+d+.02);voices.push([o,v]);
 }
 voices[0][0].onended=()=>{voices.forEach(([o,v])=>{o.disconnect();v.disconnect();});filter.disconnect();g.disconnect();};
}
function createDrums(){
 const rate=audio.sampleRate;
 for(const kind of ['kick','snare','hat']){
  const length=Math.ceil(rate*(kind==='kick'?.22:kind==='snare'?.16:.075));
  const buf=audio.createBuffer(1,length,rate),d=buf.getChannelData(0);
  let phase=0;
  for(let i=0;i<length;i++){
   const t=i/rate,env=Math.exp(-t*(kind==='kick'?23:kind==='snare'?28:70));
   if(kind==='kick'){phase+=2*Math.PI*(45+115*Math.exp(-t*32))/rate;d[i]=Math.sin(phase)*env*.85;}
   else if(kind==='snare')d[i]=(Math.random()*2-1)*env*.6+Math.sin(2*Math.PI*175*t)*env*.2;
   else d[i]=(Math.random()*2-1)*env*.36;
  }
  drumBuffers[kind]=buf;
 }
}
function drum(kind,t,vol){
 if(!audio||audio.state!=='running')return;
 const src=audio.createBufferSource(),g=audio.createGain();
 src.buffer=drumBuffers[kind];g.gain.value=vol;
 src.connect(g);g.connect(master);src.start(t);
 src.onended=()=>{src.disconnect();g.disconnect();};
}
function scheduleBeat(i,t){
 // One stage every bar, and a new musical movement every few systems.
 if(i%8===0){musicPeak=Math.max(musicPeak,conquestStage());musicStage=musicPeak;}
 const st=musicStage,bar=Math.floor(i/8),section=Math.floor(bar/8)%4;
 const movement=Math.floor(st/4)%4;
 const chord=chords[bar%4],root=roots[bar%4],theme=themes[movement];lastChordRoot=root;
 const basePhrase=theme[(i+(section===2?4:0))%theme.length];const phrase=basePhrase===null?null:basePhrase+(st>=20?Math.floor((st-20)/8)%3*2:0);
 const build=(bar%8===7),breakdown=(st>=7&&bar%16===8);
 const energy=Math.min(1,st/12);
 // At high levels, contrasting breakdowns prevent a perpetual wall of sound.
 if(phrase!==null&&!breakdown&&i%((st<2)?2:1)===0)
   note(phrase+(section===3&&st>=8?12:0),t,BEAT*(st>=6?.65:1.05),st>=8?'sawtooth':'square',.018+energy*.008);
 // Early systems keep the simple bass; later systems gain a spacious, syncopated pulse.
 if(st<3&&i%2===0)note(root,t,BEAT*1.55,'triangle',.038);
 if(st>=3&&!breakdown){
  const groove=i%16;
  if([0,3,6,8,11,14].includes(groove)){
   const accent=groove===0||groove===8;
   bassPulse(root-(st>=7?12:0),t,BEAT*(accent?1.75:1.15),accent?.075:.052);
  }
 }
 if(st>=2&&i%16===0)drone(root,t,BEAT*15.8,st>=9?.07:.045);
 if(st>=7&&i%16===0)drone(root+7,t,BEAT*15.8,.026);
 if(i%8===0)chord.forEach(n=>note(n+(movement>=2?12:0),t,BEAT*(breakdown?7:4),'sine',.011,.06));
 if(st>=2&&!breakdown&&i%2===0)drum('kick',t,.12);
 if(st>=3&&!breakdown&&i%4===2)drum('snare',t,.085);
 if(st>=4&&!breakdown)drum('hat',t, i%2?.052:.03);
 if(st>=5&&!breakdown&&i%2===1)note(root+12+arp[(i+bar)%16],t,BEAT*.48,'triangle',.019);
 if(st>=7&&!breakdown&&i%2===1)drum('kick',t,.07);
 if(st>=8&&!breakdown&&i%2===0)note(root-12,t,BEAT*.7,'sawtooth',.024);
 if(st>=10&&!breakdown&&i%2===1)drum('hat',t+BEAT*.5,.027);
 if(st>=12&&!breakdown&&i%2===0)note(chord[0]+12+arp[(i*3)%16],t,BEAT*.34,'square',.016);
 if(st>=15&&!breakdown&&i%4===3)drum('snare',t+BEAT*.5,.04);
 if(st>=18&&!breakdown&&i%2===1)note(root+24+arp[(i*5)%16],t,BEAT*.22,'triangle',.012);
 if(st>=20&&!breakdown&&i%8===4)note(root+12+(Math.floor(st/4)%3)*2,t,BEAT*3,'sine',.025,.1);
 if(st>=24&&!breakdown&&i%4===0)note(root+7+arp[(i+bar*3)%16],t,BEAT*.72,'triangle',.017);
 if(st>=28&&!breakdown&&i%8===6)drum('snare',t+BEAT*.5,.04);
 if(st>=6&&build&&i%2===1)drum('snare',t,.04);
 if(breakdown&&i%8===0)note(root-12,t,BEAT*6,'sine',.075,.12);
}
function scheduleMusic(){
 if(!musicEnabled||!audio)return;
 if(audio.state!=='running'){recoverMusic();return;}
 // A throttled background tab must never attempt to synthesize thousands of overdue beats.
 if(nextBeat<audio.currentTime-.12)nextBeat=audio.currentTime+.035;
 let count=0;
 while(nextBeat<audio.currentTime+LOOKAHEAD&&count++<5){scheduleBeat(beatIndex++,nextBeat);nextBeat+=BEAT;}
}
async function recoverMusic(){
 if(!musicEnabled||!audio||musicRecovering||document.hidden)return;
 musicRecovering=true;
 try{await audio.resume();if(audio.state==='running'){nextBeat=audio.currentTime+.05;if(!musicTimer)musicTimer=setInterval(scheduleMusic,70);}}
 catch(err){console.warn('Orbit audio resume failed',err);}
 finally{musicRecovering=false;}
}
async function toggleMusic(){
  if(!musicEnabled){
    try{
      if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.42;const compressor=audio.createDynamicsCompressor();compressor.threshold.value=-17;compressor.knee.value=14;compressor.ratio.value=5;compressor.attack.value=.004;compressor.release.value=.16;master.connect(compressor);compressor.connect(audio.destination);createDrums();}
      await audio.resume();
      musicEnabled=true;musicStage=conquestStage();nextBeat=audio.currentTime+.04;
      musicTimer=setInterval(scheduleMusic,70);scheduleMusic();
    }catch(err){musicEnabled=false;musicButton.title='Audio unavailable';return;}
  }else{
    musicEnabled=false;clearInterval(musicTimer);musicTimer=null;
    if(audio)await audio.suspend();
  }
  musicButton.textContent=musicEnabled?'♫ On':'♫ Off';
  musicButton.setAttribute('aria-pressed',String(musicEnabled));
  musicButton.setAttribute('aria-label',musicEnabled?'Turn music off':'Turn music on');
}
musicButton.addEventListener('click',toggleMusic);
document.addEventListener('visibilitychange',()=>{
 if(!document.hidden&&musicEnabled)recoverMusic();
});
window.addEventListener('focus',()=>{if(musicEnabled)recoverMusic();});
document.getElementById('restart').addEventListener('click',nextSystem);addEventListener('resize',()=>{resize();position();});resize();init();requestAnimationFrame(frame);
</script></body></html>
