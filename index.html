<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stats=document.getElementById('stats'),banner=document.getElementById('banner');
const TAU=Math.PI*2,colors={player:'#5bd9ff',enemy:'#ff6e8b',neutral:'#aeb8d0'};
let W=0,H=0,dpr=1,scale=1,center={x:0,y:0},planets=[],ships=[],stars=[],drag=null,gameOver=false,last=0,acc=0,elapsed=0,seed=0,pointer=null; const HOLD_MS=380,SUN_RADIUS=29,SUN_MU=240000,PLANET_MU=36000,FIRE_INTERVAL=.11,MAX_POWER=165,POWER_PER_PIXEL=.72,MIN_PULL=12; let resources=[],resourceClock=0,resourceId=0,portals=[],storm=null,transition=0,visualClock=0,captureChime=0,conquestCount=0,captureWaves=[],dramatic={at:-100,level:0};let touches=new Map(),selectedPlanet=null,pendingResource=null,photonTarget=null,laserBeams=[],weaponMode='rocket',consoleDrag=null,consoleHold=null,conquestMilestones=0,sunAbsorbed=0,laserImpacts=[],atomicProbes=[],novaAt=-1,novaParticles=[],novaTriggered=false,novaAtWall=0;let ideationActive=false,ideationLevel=1,ideationStage=0,ideationAuto=false,ideationClock=0,ideationSaved=null;let fireClock=0,systemNumber=1,systemsConquered=0,enemyClock=0,campaignWon=false;
const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);center={x:W/2,y:H/2+16};scale=Math.min(W/850,H/750,1.1);stars=Array.from({length:140},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.2,a:Math.random()*.5+.15}));}
function init(){seed=45219+systemNumber*7919;elapsed=0;captureWaves=[];resources=[];sunAbsorbed=0;laserImpacts=[];atomicProbes=[];novaAt=-1;novaParticles=[];novaTriggered=false;selectedPlanet=null;pendingResource=null;photonTarget=null;laserBeams=[];conquestMilestones=0;resourceClock=0;portals=[];storm=null;transition=2.8;visualClock=0;enemyClock=0;campaignWon=false;ships=[];drag=null;pointer=null;fireClock=0;touches.clear();gameOver=false;banner.classList.remove('visible');const specs=[
['Home',230,3.45,.10,24,'player',42,1.7,0],
['Cinder',135,0.25,.18,18,'neutral',18,1.05,0],
['Moss',210,2.4,-.11,21,'neutral',25,1.2,0],
['Azure',285,4.2,.08,22,'enemy',32,1.35,0],
['Ember',345,1.25,-.055,23,'enemy',34,1.4,0],
['Drift',390,3.0,.042,17,'neutral',15,1,0]];
planets=specs.map((s,i)=>({id:i,name:s[0],orbit:s[1],angle:s[2]+(systemNumber-1)*.37*(i%2?1:-1),speed:s[3]*(1+Math.min(.22,(systemNumber-1)*.035)),radius:s[4],owner:s[5],units:s[6]+(s[5]==='enemy'?Math.min(55,(systemNumber-1)*9):0),production:s[7],boostUntil:0,gravityUntil:0,shield:0,photons:0,lasers:0,driveFuel:0,atomic:0,laserReadyAt:0,dx:0,dy:0,freeOrbit:false,phase:s[8],x:0,y:0}));position();setupEnvironment();updateHUD();updateSystemButton();}
function setupEnvironment(){
 const tier=(systemNumber-1)%4;
 if(systemNumber>=3&&tier===2){portals=[{x:center.x-145*scale,y:center.y-115*scale},{x:center.x+150*scale,y:center.y+110*scale}];}
 if(systemNumber>=4&&tier===3)storm={angle:0,radius:155*scale,width:65*scale};
 if(systemNumber>=5&&tier===0)portals=[{x:center.x-160*scale,y:center.y+95*scale},{x:center.x+155*scale,y:center.y-100*scale}];
}
function resourceType(){const n=Math.random();return n<.075?'atomic':n<.16?'shield':n<.245?'photon':n<.33?'laser':n<.41?'drive':n<.49?'gravity':n<.62?'boost':'fleet';}
function spawnResource(){const edge=Math.floor(Math.random()*4),margin=18,x=edge===0?-margin:edge===1?W+margin:Math.random()*W,y=edge===2?-margin:edge===3?H+margin:Math.random()*H;const theta=Math.atan2(center.y-y,center.x-x)+(Math.random()-.5)*1.6;resources.push({id:resourceId++,x,y,vx:Math.cos(theta)*(12+Math.random()*12),vy:Math.sin(theta)*(12+Math.random()*12),type:resourceType(),value:8+Math.floor(Math.random()*9),size:(5+Math.random()*7)*1.5,rotation:Math.random()*TAU,spin:(Math.random()-.5)*1.2,shape:Array.from({length:9},()=>.73+Math.random()*.5),target:null,life:0});}
function claimResource(x,y){const r=resources.find(o=>!o.target&&Math.hypot(o.x-x,o.y-y)<Math.max(32,o.size*1.5*scale+16));if(!r)return false;pendingResource=r;showEquipment();return true;}
function updateResources(dt){const owned=planets.filter(p=>p.owner==='player');resourceClock+=dt;const interval=owned.length<=1?5/3:11/3;if(resourceClock>=interval){resourceClock=0;if(resources.length<24)spawnResource();}for(let i=resources.length-1;i>=0;i--){const o=resources[i];o.life+=dt;if(o.target){if(o.target.owner!=='player')o.target=owned[0]||null;if(o.target){const dx=o.target.x-o.x,dy=o.target.y-o.y,d=Math.hypot(dx,dy)||1;o.vx+=(dx/d*260-o.vx)*Math.min(1,dt*3);o.vy+=(dy/d*260-o.vy)*Math.min(1,dt*3);if(d<radius(o.target)+8){conquestMilestones=Math.min(10,conquestMilestones+1);dramatic={at:elapsed,level:conquestMilestones};if(o.type==='boost')o.target.boostUntil=elapsed+14;else if(o.type==='gravity')o.target.gravityUntil=elapsed+14;else if(o.type==='shield')o.target.shield=Math.min(16,o.target.shield+8);else if(o.type==='laser')o.target.lasers+=12;else if(o.type==='atomic')o.target.atomic+=1;else if(o.type==='photon')o.target.photons+=5;else if(o.type==='drive')o.target.driveFuel=Math.min(30,o.target.driveFuel+12);else o.target.units=Math.min(180,o.target.units+o.value);resources.splice(i,1);continue;}}}const sx=center.x-o.x,sy=center.y-o.y,sd=Math.max(sunRadius()*1.3,Math.hypot(sx,sy));const pull=Math.min(38,sunMu()*scale*scale/(sd*sd)*.012);o.vx+=sx/sd*pull*dt;o.vy+=sy/sd*pull*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;if(Math.hypot(o.x-center.x,o.y-center.y)<sunRadius()+o.size*scale*.4){absorbSun(o.type==='fleet'?1:2);resources.splice(i,1);continue;}if(o.life>45||o.x< -80||o.x>W+80||o.y< -80||o.y>H+80)resources.splice(i,1);}}
function sunRadius(){return (SUN_RADIUS+Math.min(40,Math.sqrt(sunAbsorbed)*3))*scale;}
function sunMu(){return SUN_MU*(1+Math.min(1.2,sunAbsorbed*.018));}
const SUN_CRITICAL=85;
function absorbSun(amount=1){if(novaTriggered)return;sunAbsorbed+=amount;if(sunAbsorbed>=SUN_CRITICAL)triggerSupernova();}
function triggerSupernova(){if(novaTriggered)return;novaTriggered=true;novaAt=elapsed;novaAtWall=performance.now();gameOver=true;campaignWon=false;touches.clear();atomicProbes=[];laserBeams=[];novaParticles=Array.from({length:180},(_,i)=>{const a=i*TAU/180+Math.random()*.12,v=70+Math.random()*460;return {a,v,size:1+Math.random()*4,hue:Math.random()<.7?25:280};});banner.textContent='SUPERNOVA · Solar system destroyed';banner.classList.add('visible');updateSystemButton();}
function applyBlastDamage(p,damage){if(damage<=0)return;const blocked=Math.min(p.shield,damage);p.shield-=blocked;p.units-=damage-blocked;if(p.units<=0){p.units=0;p.owner='neutral';p.production=0;}}
function plantAtomicProbe(p){if(!selectedPlanet||selectedPlanet.owner!=='player'||selectedPlanet.atomic<1||p.owner==='player'||gameOver)return;selectedPlanet.atomic--;atomicProbes.push({planet:p,at:elapsed,explodesAt:elapsed+5});showEquipment();}
function detonateAtomicProbe(probe){const p=probe.planet,x=p.x,y=p.y;laserImpacts.push({x,y,at:elapsed,r:radius(p)*3,atomic:true});for(const q of planets){const d=Math.hypot(q.x-x,q.y-y);const damage=q===p?50:Math.max(0,Math.round(50*(1-d/(260*scale))));applyBlastDamage(q,damage);}if(Math.hypot(x-center.x,y-center.y)<sunRadius()+radius(p)*2)absorbSun(12);}
function radius(p){return 1.5*(11+Math.sqrt(Math.max(0,p.units))*1.8)*scale;}
function mass(p){return PLANET_MU*(.55+Math.max(0,p.units)/65)*(p.gravityUntil>elapsed?1.65:1);}
function position(){for(const p of planets){if(p.freeOrbit)continue;const a=p.angle+elapsed*p.speed;p.x=center.x+Math.cos(a)*p.orbit*scale;p.y=center.y+Math.sin(a)*p.orbit*scale*.78;}}
function shoot(from,dx,dy,power,owner='player'){if(from.units<1)return;const d=Math.hypot(dx,dy);if(d<1)return;from.units-=1;const nx=dx/d,ny=dy/d,r=radius(from)+6;const a=from.angle+elapsed*from.speed;const orbitalVX=-Math.sin(a)*from.orbit*scale*from.speed,orbitalVY=Math.cos(a)*from.orbit*scale*.78*from.speed;ships.push({x:from.x+nx*r,y:from.y+ny*r,vx:nx*power+orbitalVX,vy:ny*power+orbitalVY,owner,life:0,trail:[],source:from.id,exitedSource:false,portalCooldown:0});}
function enemyLaunch(from,to){if(from.units<12)return;const dx=to.x-from.x,dy=to.y-from.y;const burst=Math.min(6,1+Math.floor((systemNumber-1)/2));for(let i=0;i<burst&&from.units>=12;i++)shoot(from,dx,dy,Math.min(205,155+systemNumber*5),'enemy');}
function gravity(x,y){let ax=0,ay=0;const bodies=[{x:center.x,y:center.y,mu:sunMu()*scale*scale,soft:sunRadius()*.7},...planets.map(p=>({x:p.x,y:p.y,mu:mass(p)*scale*scale,soft:radius(p)*.85}))];for(const p of bodies){const dx=p.x-x,dy=p.y-y,d2=Math.max(dx*dx+dy*dy,p.soft*p.soft),f=p.mu/(d2*Math.sqrt(d2));ax+=dx*f;ay+=dy*f;}return {ax,ay};}
function integrate(s,dt){const a=gravity(s.x,s.y);const nx=s.x+s.vx*dt+.5*a.ax*dt*dt,ny=s.y+s.vy*dt+.5*a.ay*dt*dt;const b=gravity(nx,ny);s.vx+=(a.ax+b.ax)*.5*dt;s.vy+=(a.ay+b.ay)*.5*dt;s.x=nx;s.y=ny;}

function capture(p,owner){if(p.owner!==owner&&p.shield>0){p.shield=Math.max(0,p.shield-1);return;}if(p.owner===owner)p.units++;else{p.units--;if(p.units<=0){p.owner=owner;p.units=1;captureChime=elapsed;if(owner==='player'){conquestCount++;conquestMilestones=Math.min(10,conquestMilestones+1);dramatic={at:elapsed,level:conquestCount};captureWaves.push({x:p.x,y:p.y,at:elapsed,hue:(conquestCount*53)%360});if(captureWaves.length>16)captureWaves.shift();playCapture();}}}}
function step(dt){if(gameOver)return;elapsed+=dt;for(let i=atomicProbes.length-1;i>=0;i--){if(elapsed>=atomicProbes[i].explodesAt){const probe=atomicProbes.splice(i,1)[0];detonateAtomicProbe(probe);if(novaTriggered)return;}}visualClock+=dt;laserBeams=laserBeams.filter(b=>elapsed-b.at<.4);laserImpacts=laserImpacts.filter(b=>elapsed-b.at<.55);transition=Math.max(0,transition-dt);position();for(const p of planets){if(!p.freeOrbit)continue;const rx=p.x-center.x,ry=p.y-center.y,dist=Math.max(1,Math.hypot(rx,ry)),ux=rx/dist,uy=ry/dist;
 // Bounded orbital corridor: a soft outer wall and damping prevent runaway planets.
 const safeX=Math.max(55,W/2-26),safeY=Math.max(65,H/2-44);
 const edge=Math.sqrt((rx/safeX)**2+(ry/safeY)**2);
 const outer=Math.max(65*scale,Math.min(safeX,safeY)*.94);
 const minOrbit=Math.max((SUN_RADIUS+radius(p)/scale+20)*scale,65*scale);
 const target=Math.max(minOrbit,Math.min(outer,dist));
 const radialSpeed=p.dx*ux+p.dy*uy;
 const tangentialSpeed=p.dx*(-uy)+p.dy*ux;
 // Solar pull plus a gentle restoring force toward a nearby stable orbital band.
 const gravityPull=sunMu()*scale*scale/Math.max(dist*dist,(SUN_RADIUS*scale)**2);
 let radialAccel=-gravityPull+Math.min(120,Math.max(-120,(target-dist)*.85-radialSpeed*.75));
 if(edge>.82)radialAccel-=Math.min(380,(edge-.82)*330+Math.max(0,radialSpeed)*2.3);
 if(dist<minOrbit+20*scale)radialAccel+=Math.min(270,(minOrbit+20*scale-dist)*3);
 // A little tangential assistance maintains circulation, without forcing a fixed orbit.
 const desiredOrbitSpeed=Math.sqrt(sunMu()*scale*scale/Math.max(dist,40*scale));
 const direction=Math.sign(tangentialSpeed)||Math.sign(p.speed)||1;
 const tangentialAccel=(direction*desiredOrbitSpeed-tangentialSpeed)*.22;
 p.dx+=(ux*radialAccel-uy*tangentialAccel)*dt;
 p.dy+=(uy*radialAccel+ux*tangentialAccel)*dt;
 const maxSpeed=240*scale,velocity=Math.hypot(p.dx,p.dy);
 if(velocity>maxSpeed){p.dx*=maxSpeed/velocity;p.dy*=maxSpeed/velocity;}
 p.x+=p.dx*dt;p.y+=p.dy*dt;
 // Hard safety limit only beyond the soft buffer, never outside the playable screen.
 const nx=p.x-center.x,ny=p.y-center.y,newEdge=Math.sqrt((nx/safeX)**2+(ny/safeY)**2);
 if(newEdge>1){p.x=center.x+nx/newEdge*.995;p.y=center.y+ny/newEdge*.995;const ex=nx/(safeX*safeX),ey=ny/(safeY*safeY),ed=Math.hypot(ex,ey)||1,normal=(p.dx*ex+p.dy*ey)/ed;if(normal>0){p.dx-=normal*ex/ed*1.25;p.dy-=normal*ey/ed*1.25;}}

 if(d<sunRadius()+radius(p)*.4){absorbSun(8+Math.floor(p.units/8));p.units=0;p.owner='neutral';p.freeOrbit=false;p.orbit=50;p.angle=0;p.speed=0;p.x=center.x;p.y=center.y;}}updateResources(dt);for(const touch of touches.values()){
 if(!touch.drag||touch.from.owner!=='player')continue;
 if(touch.mode==='drive'){const p=touch.from;if(p.driveFuel>0){p.freeOrbit=true;const vx=(touch.x-p.x),vy=(touch.y-p.y),d=Math.hypot(vx,vy)||1;p.dx+=vx/d*115*dt;p.dy+=vy/d*115*dt;p.driveFuel=Math.max(0,p.driveFuel-dt*2.5);}continue;}
 if(touch.mode==='photon'){if(touch.from.photons>0&&touch.target&&touch.fireClock<=0){launchPhoton(touch.from,touch.target);touch.fireClock=.45;}touch.fireClock-=dt;continue;}
 const dx=touch.from.x-touch.x,dy=touch.from.y-touch.y,pull=Math.hypot(dx,dy);
 if(pull>=MIN_PULL){
  if(touch.mode==='laser'){if(touch.from.lasers>0&&elapsed>=touch.from.laserReadyAt)fireLaser(touch.from,dx,dy);continue;}
